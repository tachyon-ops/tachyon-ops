name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: tachyon-ops
          github_token: ${{ secrets.METRICS_TOKEN }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#00f5ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit and Push Snake SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub contribution snake [skip ci]"
          file_pattern: "assets/github-snake*.svg"
