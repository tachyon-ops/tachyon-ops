name: Connect Four Game

on:
  issues:
    types: [opened]

jobs:
  move:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'connect4|')
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Play Move
        env:
          EVENT_ISSUE_TITLE: ${{ github.event.issue.title }}
          EVENT_USER_LOGIN: ${{ github.event.issue.user.login }}
        run: |
          python3 scripts/connect4.py

      - name: Commit Game Board
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(game): update Connect Four board [skip ci]"
          file_pattern: "README.md connect4/game.json"

      - name: Comment and Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          USER_LOGIN: ${{ github.event.issue.user.login }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "🎮 Move recorded for @$USER_LOGIN! Link Bot has made his counter-move. Check out the updated board on [Link's Profile](https://github.com/tachyon-ops)!"
          gh issue close "$ISSUE_NUMBER"
