<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12" />
      <stop offset="40%" stop-color="#0c1322" />
      <stop offset="80%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <!-- Cyan Neon Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Gold Sheikah Gradient -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Green Pulse Gradient -->
    <linearGradient id="greenPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Beam Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f5ff" stroke-width="0.75" opacity="0.06" />
      <circle cx="0" cy="0" r="1" fill="#00f5ff" opacity="0.12" />
    </pattern>

    <!-- Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.65; filter: drop-shadow(0 0 4px #00f5ff); }
        50% { opacity: 1; filter: drop-shadow(0 0 14px #00f5ff); }
      }
      @keyframes runeGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.85; }
      }
      @keyframes warpStream {
        0% { transform: translateX(-960px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(960px); opacity: 0; }
      }
      @keyframes telemetryWave {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 80; }
      }
      .anim-pulse { animation: pulseGlow 4s ease-in-out infinite; }
      .anim-rune-1 { animation: runeGlow 3s ease-in-out infinite; }
      .anim-rune-2 { animation: runeGlow 3s ease-in-out infinite 1.5s; }
      .anim-stream { animation: warpStream 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .anim-telemetry { animation: telemetryWave 6s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="260" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Tech Grid Overlay -->
  <rect width="960" height="260" rx="16" fill="url(#techGrid)" />

  <!-- Outer Cyber/Zonai Hexagonal Border Frame -->
  <rect x="8" y="8" width="944" height="244" rx="12" fill="none" stroke="#00f5ff" stroke-width="0.8" opacity="0.2" />
  <rect x="14" y="14" width="932" height="232" rx="8" fill="none" stroke="#00f5ff" stroke-width="0.5" opacity="0.1" />

  <!-- Corner Tech Brackets (Zonai/Sheikah Style) -->
  <!-- Top Left -->
  <path d="M 8 36 L 8 8 L 36 8" fill="none" stroke="#00f5ff" stroke-width="2.5" />
  <line x1="14" y1="14" x2="26" y2="14" stroke="#eab308" stroke-width="1.5" />
  <line x1="14" y1="14" x2="14" y2="26" stroke="#eab308" stroke-width="1.5" />
  <circle cx="8" cy="8" r="2.5" fill="#00f5ff" />

  <!-- Top Right -->
  <path d="M 924 8 L 952 8 L 952 36" fill="none" stroke="#00f5ff" stroke-width="2.5" />
  <line x1="934" y1="14" x2="946" y2="14" stroke="#eab308" stroke-width="1.5" />
  <line x1="946" y1="14" x2="946" y2="26" stroke="#eab308" stroke-width="1.5" />
  <circle cx="952" cy="8" r="2.5" fill="#00f5ff" />

  <!-- Bottom Left -->
  <path d="M 8 224 L 8 252 L 36 252" fill="none" stroke="#00f5ff" stroke-width="2.5" />
  <line x1="14" y1="246" x2="26" y2="246" stroke="#eab308" stroke-width="1.5" />
  <line x1="14" y1="234" x2="14" y2="246" stroke="#eab308" stroke-width="1.5" />
  <circle cx="8" cy="252" r="2.5" fill="#00f5ff" />

  <!-- Bottom Right -->
  <path d="M 924 252 L 952 252 L 952 224" fill="none" stroke="#00f5ff" stroke-width="2.5" />
  <line x1="934" y1="246" x2="946" y2="246" stroke="#eab308" stroke-width="1.5" />
  <line x1="946" y1="234" x2="946" y2="246" stroke="#eab308" stroke-width="1.5" />
  <circle cx="952" cy="252" r="2.5" fill="#00f5ff" />

  <!-- Circuit Trace Lines Left -->
  <g opacity="0.35" class="anim-rune-1">
    <path d="M 36 60 L 90 60 L 115 85 L 170 85" fill="none" stroke="#00f5ff" stroke-width="1.2" />
    <circle cx="170" cy="85" r="3" fill="#00f5ff" />
    <path d="M 36 180 L 100 180 L 125 155 L 160 155" fill="none" stroke="#00f5ff" stroke-width="1.2" />
    <circle cx="160" cy="155" r="3" fill="#00f5ff" />
  </g>

  <!-- Circuit Trace Lines Right -->
  <g opacity="0.35" class="anim-rune-2">
    <path d="M 924 60 L 870 60 L 845 85 L 790 85" fill="none" stroke="#00f5ff" stroke-width="1.2" />
    <circle cx="790" cy="85" r="3" fill="#00f5ff" />
    <path d="M 924 180 L 860 180 L 835 155 L 800 155" fill="none" stroke="#00f5ff" stroke-width="1.2" />
    <circle cx="800" cy="155" r="3" fill="#00f5ff" />
  </g>

  <!-- Animated Tachyon Telemetry Stream -->
  <g class="anim-stream">
    <line x1="0" y1="126" x2="280" y2="126" stroke="url(#cyanNeon)" stroke-width="2.5" filter="url(#neonGlow)" />
    <circle cx="280" cy="126" r="4.5" fill="#ffffff" filter="url(#neonGlow)" />
  </g>

  <!-- Central Crest / Sheikah & Triforce Emblem Geometric Overlay -->
  <g transform="translate(480, 48)" filter="url(#softGlow)">
    <polygon points="0,-20 16,10 -16,10" fill="none" stroke="url(#goldGlow)" stroke-width="1.8" class="anim-pulse" />
    <polygon points="0,-4 8,10 -8,10" fill="none" stroke="url(#goldGlow)" stroke-width="1.2" opacity="0.7" />
    <path d="M -30 5 Q -55 -15 -80 0 Q -50 18 -24 10" fill="none" stroke="#00f5ff" stroke-width="1.2" opacity="0.4" />
    <path d="M 30 5 Q 55 -15 80 0 Q 50 18 24 10" fill="none" stroke="#00f5ff" stroke-width="1.2" opacity="0.4" />
  </g>

  <!-- Main Hero Title & Identity -->
  <g id="textContent">
    <!-- Top System Status Line -->
    <g transform="translate(480, 84)" text-anchor="middle">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#00f5ff" letter-spacing="4" opacity="0.9">
        ⚡ TACHYON TELEMETRY CORE // HIGH-THROUGHPUT CLOUD ⚡
      </text>
    </g>

    <!-- Main Name: LINK -->
    <g transform="translate(480, 134)" text-anchor="middle">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Arial Black', sans-serif" font-size="50" font-weight="900" fill="url(#cyanNeon)" letter-spacing="8" filter="url(#softGlow)">
        LINK
      </text>
    </g>

    <!-- Role Subtitle -->
    <g transform="translate(480, 166)" text-anchor="middle">
      <text font-family="'Fira Code', 'Courier New', monospace" font-size="13.5" font-weight="700" fill="#e2e8f0" letter-spacing="2">
        <tspan fill="#00f5ff">HEAD OF CLOUD &amp; TELEMETRY</tspan> <tspan fill="#eab308">|</tspan> <tspan fill="#bae6fd">SYSTEMS &amp; GRAPHICS ARCHITECT</tspan>
      </text>
    </g>

    <!-- Telemetry Badges / Tech HUD Tags -->
    <g transform="translate(480, 212)" text-anchor="middle">
      <!-- Badge 1: 10M+ Msg/Sec -->
      <g transform="translate(-275, 0)">
        <rect x="-85" y="-14" width="170" height="27" rx="13.5" fill="#0c192c" stroke="#00f5ff" stroke-width="1" opacity="0.9" />
        <circle cx="-68" cy="-0.5" r="3.5" fill="#00f5ff" />
        <text x="6" y="4" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#bae6fd" text-anchor="middle" letter-spacing="0.5">
          ⚡ 10M+ MSG/SEC
        </text>
      </g>

      <!-- Badge 2: Protocols -->
      <g transform="translate(-90, 0)">
        <rect x="-90" y="-14" width="180" height="27" rx="13.5" fill="#0c192c" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
        <circle cx="-72" cy="-0.5" r="3.5" fill="#38bdf8" />
        <text x="6" y="4" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#bae6fd" text-anchor="middle" letter-spacing="0.5">
          📡 LoRaWAN • SiLA 2 • MQTT
        </text>
      </g>

      <!-- Badge 3: 1M+ Dot 3D Canvas -->
      <g transform="translate(100, 0)">
        <rect x="-90" y="-14" width="180" height="27" rx="13.5" fill="#1c1917" stroke="#eab308" stroke-width="1" opacity="0.9" />
        <circle cx="-72" cy="-0.5" r="3.5" fill="#eab308" />
        <text x="6" y="4" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="0.5">
          🧊 1M+ DOT 3D CANVAS
        </text>
      </g>

      <!-- Badge 4: Zurich & 15 Yrs XP -->
      <g transform="translate(285, 0)">
        <rect x="-85" y="-14" width="170" height="27" rx="13.5" fill="#052e16" stroke="#10b981" stroke-width="1" opacity="0.9" />
        <circle cx="-68" cy="-0.5" r="3.5" fill="#10b981" />
        <text x="6" y="4" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle" letter-spacing="0.5">
          🇨🇭 ZURICH // 15Y XP
        </text>
      </g>
    </g>
  </g>

  <!-- Bottom Sheikah Energy Line -->
  <line x1="120" y1="240" x2="840" y2="240" stroke="url(#cyanNeon)" stroke-width="1" opacity="0.4" stroke-dasharray="8 4 2 4" />
</svg>
